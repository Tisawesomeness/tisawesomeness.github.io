<button class="action-btn version-filter-btn" aria-haspopup="listbox" aria-expanded="false" aria-controls="version-filter-options" title="Filter version">
  <svg class="version-filter-icon" aria-hidden="true" viewBox="0 0 24 24" width="20" height="20" fill="none" stroke="currentColor" stroke-width="2" stroke-linejoin="round">
    <path d="M2 2 L12 2 L22 12 L12 22 L2 12 Z"/>
    <circle cx="7" cy="7" r="1" fill="white"/>
  </svg>
  <span class="version-filter-text">All</span>
  <svg class="version-filter-chevron" aria-hidden="true" viewBox="0 0 16 16" width="12" height="12">
    <path fill-rule="evenodd" d="M4.707 5.707a.75.75 0 011.06 0L8 8.439l2.233-2.732a.75.75 0 111.06 1.06l-3.25 4a.75.75 0 01-1.06 0l-3.25-4a.75.75 0 010-1.06z"/>
  </svg>
</button>

<div class="version-filter-dropdown" role="listbox" aria-label="Filter by version">
  <div class="version-filter-options" role="presentation">
    <button class="version-filter-option" role="option" data-value="all" aria-selected="true">All</button>
    {% assign releases = site.categories["snapshots"] | where_exp: "post", "post.release" | group_by: "release" | sort: 'name' | reverse %}
    {% for group in releases %}
      <button class="version-filter-option" role="option" data-value="{{ group.name }}" aria-selected="false">{{ group.name }}</button>
    {% endfor %}
  </div>
</div>
